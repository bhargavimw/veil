services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - VEIL_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ..:/app
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_VEIL_API_URL=http://localhost:8000
    depends_on:
      - gateway
